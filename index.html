<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meus Gastos">
<title>Meus Gastos</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0B2545;--navy2:#123A6B;--blue:#1565C0;--bg:#F4F7FB;--card:#fff;
  --ink:#0B2545;--muted:#5C6B80;--line:rgba(11,37,69,.12);
  --green:#1F7A45;--red:#B3261E;
  --disp:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:96px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:16px 0 18px;border-radius:0 0 22px 22px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-size:14px;letter-spacing:-.01em;opacity:.9}
.brand img{width:22px;height:22px;border-radius:6px}
.mes{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.mes button{background:rgba(255,255,255,.14);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer}
.mes strong{font-family:var(--disp);font-weight:500;font-size:15px;text-transform:capitalize}
.total{font-family:var(--disp);font-size:34px;font-weight:600;letter-spacing:-.03em;margin:10px 0 2px}
.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.saldo{display:flex;gap:18px;margin-top:12px;font-size:12.5px}
.saldo span{color:rgba(255,255,255,.62)}
.saldo b{display:block;font-family:var(--disp);font-size:14px;color:#fff;font-weight:500}
h2{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:6px;height:6px;background:var(--blue);border-radius:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(11,37,69,.05)}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{flex:0 0 auto}
.donut .meio{position:relative}
.donut .meio .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .meio .c b{font-family:var(--disp);font-size:15px;display:block;line-height:1.1}
.donut .meio .c span{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.cats{flex:1;min-width:0}
.cat{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.cat i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.cat .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .p{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cat .v{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
.item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info span{font-size:11.5px;color:var(--muted)}
.item .val{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.item .val.gasto{color:var(--red)}
.item .val.receita{color:var(--green)}
.item button{background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 4px;line-height:1}
.vazio{text-align:center;color:var(--muted);font-size:13px;padding:18px 6px;line-height:1.6}
form{display:grid;gap:10px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-family:var(--body);font-size:14px;color:var(--ink);background:#fff;-webkit-appearance:none}
input:focus,select:focus{outline:2px solid rgba(21,101,192,.35);border-color:var(--blue)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#EDF2F9;border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-family:var(--body);font-size:14.5px;font-weight:600;cursor:pointer;margin-top:2px}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(244,247,251,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
footer .wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
footer .btn{margin:0;padding:14px}
.fade{animation:sobe .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><img src="favicon.svg" alt="">meus gastos</div>
  <div class="mes">
    <button id="prev" aria-label="mês anterior">‹</button>
    <strong id="mesNome">—</strong>
    <button id="next" aria-label="próximo mês">›</button>
  </div>
  <div class="sub">Total de gastos</div>
  <div class="total" id="total">R$ 0,00</div>
  <div class="saldo">
    <div><span>Receitas</span><b id="receitas">R$ 0,00</b></div>
    <div><span>Saldo</span><b id="saldo">R$ 0,00</b></div>
    <div><span>Lançamentos</span><b id="qtd">0</b></div>
  </div>
</div></header>

<div class="wrap">
  <h2>Gastos por categoria</h2>
  <div class="card">
    <div class="donut">
      <div class="meio">
        <svg width="132" height="132" viewBox="0 0 132 132" id="donutSvg"></svg>
        <div class="c"><div><b id="donutTotal">0</b><span>gastos</span></div></div>
      </div>
      <div class="cats" id="cats"></div>
    </div>
  </div>

  <h2>Lançamentos do mês</h2>
  <div class="card" id="lista"></div>

  <h2>Novo lançamento</h2>
  <div class="card">
    <form id="form">
      <div class="seg">
        <button type="button" data-tipo="gasto" class="on">Gasto</button>
        <button type="button" data-tipo="receita">Receita</button>
      </div>
      <input id="valor" inputmode="decimal" placeholder="Valor (ex: 45,90)" required>
      <select id="categoria" required></select>
      <input id="descricao" placeholder="Descrição (opcional)">
      <input id="data" type="date" required>
      <button class="btn" type="submit">Adicionar</button>
    </form>
  </div>

  <h2>Ajustes</h2>
  <div class="acoes">
    <button class="btn ghost" id="exportar">Exportar CSV</button>
    <button class="btn ghost" id="limpar">Apagar tudo</button>
  </div>
</div>

<footer><div class="wrap">
  <button class="btn" id="irForm">Novo lançamento</button>
  <button class="btn ghost" id="irLista">Ver lançamentos</button>
</div></footer>

<script>
const $=s=>document.querySelector(s);
const CORES=['#0B2545','#1565C0','#3D8BFF','#7FB2F0','#1F7A45','#57A773','#C4622D','#E0A458','#7A4EA0','#B3261E','#8A94A6'];
const CATS=['Alimentação','Transporte','Moradia','Faculdade','Saúde','Lazer','Vestuário','Serviços','Pet','Empresarial','Outros'];
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const nf=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const mesISO=()=>hojeISO().slice(0,7);

let dados=JSON.parse(localStorage.getItem('gastos-v1')||'[]');
let mes=mesISO(), tipo='gasto';

$('#data').value=hojeISO();
$('#categoria').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');

function salva(){localStorage.setItem('gastos-v1',JSON.stringify(dados));}
function nomeMes(iso){const [a,m]=iso.split('-');return new Date(a,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});}
function doMes(){return dados.filter(d=>d.data.slice(0,7)===mes);}

function desenha(){
  const lista=doMes();
  const gastos=lista.filter(d=>d.tipo==='gasto');
  const receitas=lista.filter(d=>d.tipo==='receita');
  const totalG=gastos.reduce((a,b)=>a+b.valor,0);
  const totalR=receitas.reduce((a,b)=>a+b.valor,0);

  $('#mesNome').textContent=nomeMes(mes);
  $('#total').textContent=money(totalG);
  $('#receitas').textContent=money(totalR);
  $('#saldo').textContent=money(totalR-totalG);
  $('#qtd').textContent=lista.length;

  // agrupa por categoria
  const mapa={};
  gastos.forEach(g=>{mapa[g.categoria]=(mapa[g.categoria]||0)+g.valor;});
  const arr=Object.entries(mapa).sort((a,b)=>b[1]-a[1]);
  const total=totalG||1;

  // donut
  const R=54, C=2*Math.PI*R;
  let off=0, svg='';
  svg+=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="#EDF2F9" stroke-width="16"/>`;
  arr.forEach(([cat,val],i)=>{
    const frac=val/total, len=frac*C;
    svg+=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${CORES[i%CORES.length]}" stroke-width="16"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)" stroke-linecap="butt"/>`;
    off+=len;
  });
  $('#donutSvg').innerHTML=svg;
  $('#donutTotal').textContent=arr.length?Math.round(arr[0][1]/total*100)+'%':'0%';

  $('#cats').innerHTML=arr.length?arr.map(([cat,val],i)=>
    `<div class="cat"><i style="background:${CORES[i%CORES.length]}"></i><span class="n">${cat}</span>
     <span class="p">${Math.round(val/total*100)}%</span><span class="v">${money(val)}</span></div>`).join('')
    :`<div class="cat"><span class="n" style="color:var(--muted)">Nenhum gasto neste mês</span></div>`;

  // lista
  const ordenado=[...lista].sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);
  $('#lista').innerHTML=ordenado.length?ordenado.map(d=>{
    const i=CATS.indexOf(d.categoria), cor=CORES[(i<0?10:i)%CORES.length];
    const [a,m,dia]=d.data.split('-');
    return `<div class="item fade"><i class="dot" style="background:${cor}"></i>
      <div class="info"><b>${d.descricao||d.categoria}</b><span>${d.categoria} · ${dia}/${m}</span></div>
      <div class="val ${d.tipo}">${d.tipo==='gasto'?'-':'+'}${money(d.valor)}</div>
      <button data-del="${d.id}" aria-label="apagar">×</button></div>`;
  }).join(''):'<div class="vazio">Nada lançado neste mês ainda.<br>Use o botão abaixo para começar.</div>';
}

document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  tipo=b.dataset.tipo;
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
});

$('#form').onsubmit=e=>{
  e.preventDefault();
  const v=parseFloat($('#valor').value.replace(/\./g,'').replace(',','.'));
  if(!isFinite(v)||v<=0){$('#valor').focus();return;}
  dados.push({id:Date.now(),tipo,valor:v,categoria:$('#categoria').value,
              descricao:$('#descricao').value.trim(),data:$('#data').value});
  salva();
  mes=$('#data').value.slice(0,7);
  $('#valor').value='';$('#descricao').value='';
  desenha();
  window.scrollTo({top:0,behavior:'smooth'});
};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-del]');
  if(!b) return;
  dados=dados.filter(d=>String(d.id)!==b.dataset.del);
  salva();desenha();
});

$('#prev').onclick=()=>{const [a,m]=mes.split('-').map(Number);const d=new Date(a,m-2,1);mes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;desenha();};
$('#next').onclick=()=>{const [a,m]=mes.split('-').map(Number);const d=new Date(a,m,1);mes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;desenha();};

$('#exportar').onclick=()=>{
  const linhas=[['data','tipo','categoria','descricao','valor']].concat(
    dados.map(d=>[d.data,d.tipo,d.categoria,(d.descricao||'').replace(/;/g,','),String(d.valor).replace('.',',')]));
  const csv=linhas.map(l=>l.join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='meus-gastos.csv';a.click();URL.revokeObjectURL(a.href);
};

$('#limpar').onclick=()=>{
  if(confirm('Apagar todos os lançamentos? Isso não volta.')){dados=[];salva();desenha();}
};

$('#irForm').onclick=()=>$('#form').scrollIntoView({behavior:'smooth',block:'center'});
$('#irLista').onclick=()=>$('#lista').scrollIntoView({behavior:'smooth',block:'start'});

desenha();

if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
