<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meus Gastos">
<title>Meus Gastos</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0B2545;--navy2:#123A6B;--blue:#1565C0;--sky:#E8F0FA;
  --bg:#F4F7FB;--card:#FFFFFF;--ink:#0B2545;--muted:#5C6B80;
  --line:rgba(11,37,69,.10);--green:#1F7A45;--red:#B3261E;
  --disp:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#080F1B;--card:#101C2E;--ink:#EAF0F8;--muted:#93A3B8;--line:rgba(255,255,255,.10);--sky:#16243A}
}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:110px;transition:background .3s}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* topo */
.hero{position:relative;background:linear-gradient(160deg,#0B2545 0%,#123A6B 55%,#1565C0 130%);color:#fff;
  padding:16px 0 26px;border-radius:0 0 28px 28px;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(127,178,240,.35),transparent 65%)}
.hero .wrap{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:13.5px;letter-spacing:-.01em;opacity:.92}
.brand img{width:22px;height:22px;border-radius:6px}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer;transition:transform .15s}
.top button:active{transform:scale(.92)}
.mes{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
.mes button{background:rgba(255,255,255,.12);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;transition:.15s}
.mes button:active{transform:scale(.9);background:rgba(255,255,255,.24)}
.mes strong{font-family:var(--disp);font-weight:500;font-size:14.5px;text-transform:capitalize;min-width:140px;text-align:center}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);text-align:center;margin-top:14px}
.total{font-family:var(--disp);font-size:40px;font-weight:600;letter-spacing:-.035em;text-align:center;margin:4px 0 0;
  font-variant-numeric:tabular-nums;line-height:1}
.trilha{height:5px;background:rgba(255,255,255,.16);border-radius:99px;margin:14px auto 0;max-width:280px;overflow:hidden}
.trilha i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7FB2F0,#fff);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mini{display:flex;justify-content:center;gap:22px;margin-top:14px;font-size:11.5px;color:rgba(255,255,255,.62)}
.mini b{display:block;font-family:var(--disp);font-size:14px;color:#fff;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px}

/* cartões */
h2{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:400;
  margin:24px 0 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:6px;height:6px;background:var(--blue);border-radius:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;
  box-shadow:0 2px 10px rgba(11,37,69,.05);animation:entra .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* rosca */
.donut{display:flex;align-items:center;gap:14px}
.rosca{position:relative;flex:0 0 auto}
.rosca .centro{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.rosca .centro b{font-family:var(--disp);font-size:17px;display:block;line-height:1.05}
.rosca .centro span{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.rosca circle.seg{cursor:pointer;transition:stroke-width .2s ease,opacity .2s ease}
.rosca circle.seg:active{stroke-width:20}
.cats{flex:1;min-width:0;display:grid;gap:2px}
.cat{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 8px;border-radius:10px;cursor:pointer;
  transition:background .18s,transform .18s}
.cat:active{transform:scale(.98)}
.cat.on{background:var(--sky)}
.cat i{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.cat .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .p{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cat .v{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}

/* filtros */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;
  font-family:var(--body);font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;transition:.18s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* lista */
.item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);position:relative;
  transition:transform .22s ease,opacity .22s}
.item:last-child{border-bottom:0}
.item .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info span{font-size:11.5px;color:var(--muted)}
.item .val{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.item .val.gasto{color:var(--red)}
.item .val.receita{color:var(--green)}
.item .del{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:1;opacity:.55}
.item.saindo{transform:translateX(-60px);opacity:0}
.vazio{text-align:center;color:var(--muted);font-size:13px;padding:22px 8px;line-height:1.65}
.vazio .em{font-size:26px;display:block;margin-bottom:8px;opacity:.8}

/* botão flutuante */
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
  border:0;background:linear-gradient(150deg,#1565C0,#0B2545);color:#fff;font-size:28px;line-height:1;cursor:pointer;
  box-shadow:0 10px 24px rgba(11,37,69,.34);transition:transform .16s;z-index:30}
.fab:active{transform:scale(.92) rotate(45deg)}

/* folha */
.fundo{position:fixed;inset:0;background:rgba(6,15,27,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:40}
.fundo.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;z-index:50;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.folha.on{transform:none}
.puxador{width:42px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 14px}
.folha h3{font-family:var(--disp);font-size:17px;margin:0 0 14px;font-weight:600}
.seg{display:flex;background:var(--sky);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:11px;border-radius:11px;font-family:var(--body);
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.18s}
.seg button.on{background:var(--navy);color:#fff}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;font-family:var(--body);
  font-size:15px;color:var(--ink);background:var(--card);margin-bottom:10px;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.15)}
.atalhos{display:flex;gap:8px;margin:-2px 0 12px;flex-wrap:wrap}
.atalhos button{flex:1;min-width:62px;padding:10px 0;border-radius:11px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-family:var(--body);font-size:12.5px;font-weight:600;cursor:pointer}
.atalhos button:active{background:var(--sky)}
.grade-cat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.grade-cat button{padding:11px 6px;border-radius:13px;border:1px solid var(--line);background:transparent;
  color:var(--ink);font-family:var(--body);font-size:11.5px;font-weight:500;cursor:pointer;line-height:1.25}
.grade-cat button span{display:block;font-size:16px;margin-bottom:3px}
.grade-cat button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{width:100%;padding:16px;border:0;border-radius:15px;background:var(--navy);color:#fff;font-family:var(--body);
  font-size:15px;font-weight:600;cursor:pointer;transition:transform .14s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}

/* aviso */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:.28s;z-index:60;box-shadow:0 8px 22px rgba(11,37,69,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="hero"><div class="wrap">
  <div class="top">
    <div class="brand"><img src="favicon.svg" alt="">meus gastos</div>
    <button id="hoje" aria-label="voltar para hoje">hoje</button>
  </div>
  <div class="mes">
    <button id="prev" aria-label="mês anterior">‹</button>
    <strong id="mesNome">—</strong>
    <button id="next" aria-label="próximo mês">›</button>
  </div>
  <div class="lbl">Gastos do mês</div>
  <div class="total" id="total">R$ 0,00</div>
  <div class="trilha"><i id="trilha"></i></div>
  <div class="mini">
    <div>Receitas<b id="receitas">R$ 0,00</b></div>
    <div>Saldo<b id="saldo">R$ 0,00</b></div>
    <div>Lançamentos<b id="qtd">0</b></div>
  </div>
</div></div>

<div class="wrap">
  <h2>Gastos por categoria</h2>
  <div class="card">
    <div class="donut">
      <div class="rosca">
        <svg width="140" height="140" viewBox="0 0 140 140" id="rosca"></svg>
        <div class="centro"><div><b id="pctMaior">0%</b><span id="lblMaior">vazio</span></div></div>
      </div>
      <div class="cats" id="cats"></div>
    </div>
  </div>

  <h2 id="tituloLista">Lançamentos do mês</h2>
  <div class="chips" id="chips"></div>
  <div class="card" id="lista" style="margin-top:10px"></div>

  <h2>Ajustes</h2>
  <div class="acoes">
    <button class="btn ghost" id="exportar">Exportar CSV</button>
    <button class="btn ghost" id="limpar">Apagar tudo</button>
  </div>
</div>

<button class="fab" id="fab" aria-label="novo lançamento">+</button>

<div class="fundo" id="fundo"></div>
<div class="folha" id="folha">
  <div class="puxador"></div>
  <h3>Novo lançamento</h3>
  <div class="seg" id="seg">
    <button data-tipo="gasto" class="on">Gasto</button>
    <button data-tipo="receita">Receita</button>
  </div>
  <input id="valor" inputmode="decimal" placeholder="Valor (ex: 45,90)" autocomplete="off">
  <div class="atalhos">
    <button data-soma="10">+10</button>
    <button data-soma="20">+20</button>
    <button data-soma="50">+50</button>
    <button data-soma="100">+100</button>
  </div>
  <div class="grade-cat" id="gradeCat"></div>
  <input id="descricao" placeholder="Descrição (opcional)" autocomplete="off">
  <input id="data" type="date">
  <button class="btn" id="salvar">Adicionar</button>
</div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const CATS=[
 {n:'Alimentação',e:'🍽'},{n:'Transporte',e:'🚗'},{n:'Moradia',e:'🏠'},{n:'Faculdade',e:'🎓'},
 {n:'Saúde',e:'💊'},{n:'Lazer',e:'🎬'},{n:'Vestuário',e:'👕'},{n:'Serviços',e:'🧾'},
 {n:'Pet',e:'🐾'},{n:'Empresarial',e:'💼'},{n:'Outros',e:'•'}
];
const CORES=['#0B2545','#1565C0','#3D8BFF','#7FB2F0','#1F7A45','#57A773','#C4622D','#E0A458','#7A4EA0','#B3261E','#8A94A6'];
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hojeISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const vibrar=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

let dados=JSON.parse(localStorage.getItem('gastos-v1')||'[]');
let mes=hojeISO().slice(0,7);
let tipo='gasto', catSel='Outros', filtro=null;

function salva(){localStorage.setItem('gastos-v1',JSON.stringify(dados));}
function nomeMes(iso){const [a,m]=iso.split('-');return new Date(a,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});}
function doMes(){return dados.filter(d=>d.data.slice(0,7)===mes);}
function corDe(cat){const i=CATS.findIndex(c=>c.n===cat);return CORES[(i<0?10:i)%CORES.length];}
function emojiDe(cat){const c=CATS.find(x=>x.n===cat);return c?c.e:'•';}

function aviso(txt){const t=$('#toast');t.textContent=txt;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}

/* números que sobem */
const alvo={total:0,receitas:0,saldo:0};
function animaNum(el,de,para,formato){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=formato(para);return;}
  const t0=performance.now(),dur=520;
  const passo=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=formato(de+(para-de)*e);
    if(p<1)requestAnimationFrame(passo);};
  requestAnimationFrame(passo);
}

/* rosca animada */
let roscaAtual=0;
function desenhaRosca(segs,total,progresso){
  const R=56,C=2*Math.PI*R;let off=0,html='';
  html+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--sky)" stroke-width="15"/>`;
  segs.forEach((s,i)=>{
    const len=(s.val/(total||1))*C*progresso;
    html+=`<circle class="seg" data-cat="${s.cat}" cx="70" cy="70" r="${R}" fill="none"
      stroke="${CORES[i%CORES.length]}" stroke-width="15"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 70 70)" ${filtro&&filtro!==s.cat?'opacity="0.35"':''}/>`;
    off+=(s.val/(total||1))*C*progresso;
  });
  $('#rosca').innerHTML=html;
}
function animaRosca(segs,total){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){desenhaRosca(segs,total,1);return;}
  const t0=performance.now(),dur=750;
  const passo=t=>{const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);
    desenhaRosca(segs,total,e);if(p<1)requestAnimationFrame(passo);};
  requestAnimationFrame(passo);
}

function render(){
  const lista=doMes();
  const gastos=lista.filter(d=>d.tipo==='gasto');
  const receitas=lista.filter(d=>d.tipo==='receita');
  const totalG=gastos.reduce((a,b)=>a+b.valor,0);
  const totalR=receitas.reduce((a,b)=>a+b.valor,0);

  $('#mesNome').textContent=nomeMes(mes);
  animaNum($('#total'),alvo.total,totalG,money); alvo.total=totalG;
  animaNum($('#receitas'),alvo.receitas,totalR,money); alvo.receitas=totalR;
  animaNum($('#saldo'),alvo.saldo,totalR-totalG,money); alvo.saldo=totalR-totalG;
  $('#qtd').textContent=lista.length;

  const uso=totalR>0?Math.min(100,Math.round(totalG/totalR*100)):0;
  $('#trilha').style.width=uso+'%';

  const mapa={};
  gastos.forEach(g=>{mapa[g.categoria]=(mapa[g.categoria]||0)+g.valor;});
  const arr=Object.entries(mapa).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>({cat,val}));

  animaRosca(arr,totalG||1);
  const maior=arr[0];
  $('#pctMaior').textContent=maior?Math.round(maior.val/(totalG||1)*100)+'%':'0%';
  $('#lblMaior').textContent=maior?maior.cat.split(' ')[0]:'vazio';

  $('#cats').innerHTML=arr.length?arr.map((s,i)=>
    `<div class="cat ${filtro===s.cat?'on':''}" data-cat="${s.cat}">
      <i style="background:${CORES[i%CORES.length]}"></i><span class="n">${s.cat}</span>
      <span class="p">${Math.round(s.val/(totalG||1)*100)}%</span><span class="v">${money(s.val)}</span></div>`).join('')
    :`<div class="cat"><span class="n" style="color:var(--muted)">Nenhum gasto neste mês</span></div>`;

  // chips de filtro
  const usadas=[...new Set(lista.map(d=>d.categoria))];
  $('#chips').innerHTML=`<button class="chip ${filtro===null?'on':''}" data-f="">Tudo</button>`+
    usadas.map(c=>`<button class="chip ${filtro===c?'on':''}" data-f="${c}">${emojiDe(c)} ${c}</button>`).join('');

  // lista
  const visivel=filtro?lista.filter(d=>d.categoria===filtro):lista;
  const ordenado=[...visivel].sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);
  $('#tituloLista').textContent=filtro?('Lançamentos · '+filtro):'Lançamentos do mês';
  $('#lista').innerHTML=ordenado.length?ordenado.map(d=>{
    const [a,m,dia]=d.data.split('-');
    return `<div class="item" data-id="${d.id}">
      <div class="ico" style="background:${corDe(d.categoria)}18;color:${corDe(d.categoria)}">${emojiDe(d.categoria)}</div>
      <div class="info"><b>${d.descricao||d.categoria}</b><span>${d.categoria} · ${dia}/${m}</span></div>
      <div class="val ${d.tipo}">${d.tipo==='gasto'?'−':'+'}${money(d.valor)}</div>
      <button class="del" data-del="${d.id}" aria-label="apagar">×</button></div>`;
  }).join(''):`<div class="vazio"><span class="em">🧾</span>${filtro?'Nada em '+filtro+' neste mês.':'Nada lançado neste mês ainda.'}</div>`;
}

/* filtro por categoria (gráfico, lista e chips) */
document.addEventListener('click',e=>{
  const seg=e.target.closest('[data-cat]');
  const chip=e.target.closest('[data-f]');
  if(seg||chip){
    const cat=seg?seg.dataset.cat:(chip.dataset.f||null);
    filtro=(filtro===cat)?null:cat;
    vibrar(8);render();return;
  }
  const del=e.target.closest('[data-del]');
  if(del){
    const el=del.closest('.item');
    el.classList.add('saindo');
    vibrar(15);
    setTimeout(()=>{
      dados=dados.filter(d=>String(d.id)!==del.dataset.del);
      salva();render();aviso('Lançamento apagado');
    },200);
  }
});

/* folha de novo lançamento */
function abreFolha(){
  $('#fundo').classList.add('on');$('#folha').classList.add('on');
  $('#data').value=$('#data').value||hojeISO();
  setTimeout(()=>$('#valor').focus(),260);
  vibrar(8);
}
function fechaFolha(){$('#fundo').classList.remove('on');$('#folha').classList.remove('on');}
$('#fab').onclick=abreFolha;
$('#fundo').onclick=fechaFolha;

$('#seg').onclick=e=>{
  const b=e.target.closest('[data-tipo]');if(!b)return;
  tipo=b.dataset.tipo;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  vibrar(6);
};

$('#gradeCat').innerHTML=CATS.map(c=>
  `<button data-c="${c.n}" class="${c.n===catSel?'on':''}"><span>${c.e}</span>${c.n}</button>`).join('');
$('#gradeCat').onclick=e=>{
  const b=e.target.closest('[data-c]');if(!b)return;
  catSel=b.dataset.c;
  document.querySelectorAll('#gradeCat button').forEach(x=>x.classList.toggle('on',x===b));
  vibrar(6);
};

document.querySelectorAll('[data-soma]').forEach(b=>b.onclick=()=>{
  const atual=parseFloat(($('#valor').value||'0').replace(/\./g,'').replace(',','.'))||0;
  $('#valor').value=String(atual+Number(b.dataset.soma)).replace('.',',');
  vibrar(6);
});

$('#salvar').onclick=()=>{
  const v=parseFloat(($('#valor').value||'').replace(/\./g,'').replace(',','.'));
  if(!isFinite(v)||v<=0){$('#valor').focus();aviso('Digite um valor');return;}
  const data=$('#data').value||hojeISO();
  dados.push({id:Date.now(),tipo,valor:v,categoria:catSel,descricao:$('#descricao').value.trim(),data});
  salva();
  mes=data.slice(0,7);filtro=null;
  $('#valor').value='';$('#descricao').value='';
  fechaFolha();render();
  vibrar(12);
  aviso(tipo==='gasto'?`Gasto de ${money(v)} lançado`:`Receita de ${money(v)} lançada`);
};

/* meses */
function anda(delta){
  const [a,m]=mes.split('-').map(Number);
  const d=new Date(a,m-1+delta,1);
  mes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  filtro=null;vibrar(6);render();
}
$('#prev').onclick=()=>anda(-1);
$('#next').onclick=()=>anda(1);
$('#hoje').onclick=()=>{mes=hojeISO().slice(0,7);filtro=null;render();};

/* gesto lateral no topo */
(function(){
  let x0=null,y0=null;
  const h=document.querySelector('.hero');
  h.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  h.addEventListener('touchend',e=>{
    if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6) anda(dx<0?1:-1);
    x0=null;y0=null;
  },{passive:true});
})();

/* exportar e limpar */
$('#exportar').onclick=()=>{
  const linhas=[['data','tipo','categoria','descricao','valor']].concat(
    dados.map(d=>[d.data,d.tipo,d.categoria,(d.descricao||'').replace(/;/g,','),String(d.valor).replace('.',',')]));
  const csv=linhas.map(l=>l.join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='meus-gastos.csv';a.click();URL.revokeObjectURL(a.href);
  aviso('CSV exportado');
};
$('#limpar').onclick=()=>{
  if(confirm('Apagar todos os lançamentos? Isso não volta.')){
    dados=[];salva();render();aviso('Tudo apagado');
  }
};

$('#data').value=hojeISO();
render();

if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
